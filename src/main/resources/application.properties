quarkus.application.name=caixaverso-cotacao
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:${H2_PATH:./data/cotacao};DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=${H2_USERNAME:sa}
quarkus.datasource.password=${H2_PASSWORD:}
quarkus.datasource.jdbc.max-size=8
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.oidc.application-type=service
quarkus.oidc.devservices.enabled=false
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.roles.role-claim-path=${OIDC_ROLE_CLAIM:groups}
quarkus.log.console.json.enabled=true
quarkus.swagger-ui.always-include=false